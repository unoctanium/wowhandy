name: Release

# Push a tag "vX.Y.Z" (matching src/wowhandy/__init__.py) to publish:
#   PyPI package (trusted publishing, no token) + GitHub release with wowhandy.pyz.
# "Run workflow" by hand to rehearse on TestPyPI only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install build -e '.[test]'
          python -m pytest -q
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import wowhandy; print(wowhandy.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Build package (sdist + wheel)
        run: python -m build --outdir python-dist
      - name: Build single file
        run: |
          python scripts/build_zipapp.py
          ./dist/wowhandy.pyz --version
          mkdir zipapp && mv dist/wowhandy.pyz zipapp/ && cp install.sh zipapp/
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: zipapp
          path: zipapp/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python-dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "wowhandy ${GITHUB_REF_NAME#v}" --generate-notes
