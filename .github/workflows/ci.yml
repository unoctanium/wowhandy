name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q
      - name: Single-file build smoke test
        run: |
          python scripts/build_zipapp.py
          ./dist/wowhandy.pyz --version
          test "$(./dist/wowhandy.pyz --dry-run 'Kanal Gruppe wir pullen gleich.')" = "/p wir pullen gleich"
      - name: Installer test (throwaway HOME)
        run: |
          # The runner sets XDG_* variables; unset them so config and log land in the throwaway HOME
          home="$RUNNER_TEMP/home"
          noxdg="env -u XDG_CONFIG_HOME -u XDG_STATE_HOME HOME=$home"
          $noxdg WOWHANDY_URL="file://$PWD/dist/wowhandy.pyz" sh install.sh
          "$home/.local/bin/wowhandy" --version
          test -f "$home/.config/wowhandy/config.toml"
          $noxdg "$home/.local/bin/wowhandy" --uninstall --purge
          test ! -e "$home/.local/bin/wowhandy"
